# PDKS - yerinde (on-premise) kurulum
#
# KVKK gereği kişisel veriler yurt dışına aktarılmaz; bu yığın tamamen
# kurum içinde çalışır ve dışarıya bağlantı gerektirmez.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdks
      POSTGRES_USER: pdks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlanmalı}
    volumes:
      - pdks-db:/var/lib/postgresql/data
      # Şema ilk açılışta otomatik uygulanır
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdks -d pdks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pdks:${POSTGRES_PASSWORD}@db:5432/pdks
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımlanmalı}
      PHOTO_STORAGE_PATH: /var/lib/pdks/photos
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-60}
      # Logo Tiger (salt okunur MSSQL)
      LOGO_MSSQL_DSN: ${LOGO_MSSQL_DSN:-}
      LOGO_SYNC_ENABLED: ${LOGO_SYNC_ENABLED:-false}
    volumes:
      - pdks-photos:/var/lib/pdks/photos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  pdks-db:
  pdks-photos:
