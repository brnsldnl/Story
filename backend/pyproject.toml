[project]
name = "pdks-backend"
version = "0.1.0"
description = "PDKS - Personel Devam Kontrol Sistemi, API sunucusu"
requires-python = ">=3.11"

# Tüm bağımlılıklar izin verici açık kaynak lisanslıdır (MIT / BSD / Apache-2.0).
dependencies = [
    "fastapi>=0.115",           # MIT
    "uvicorn[standard]>=0.30",  # BSD
    "sqlalchemy>=2.0",          # MIT
    "psycopg[binary]>=3.2",     # LGPL-3.0 (kütüphane olarak kullanım serbest)
    "pydantic[email]>=2.8",     # MIT (EmailStr icin email-validator)
    "pydantic-settings>=2.4",   # MIT
    "python-multipart>=0.0.9",  # Apache-2.0
    "httpx>=0.27",              # BSD
    "bcrypt>=4.0",              # Apache-2.0
    "pyjwt>=2.9",               # MIT
    "apscheduler>=3.10",        # MIT
]

[project.optional-dependencies]
# Logo MSSQL okuması için; sistem tarafında FreeTDS veya MS ODBC Driver gerekir.
logo = ["pyodbc>=5.1"]          # MIT
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File() argüman varsayılanında çağrılır - FastAPI'nin
# gerektirdiği yazım biçimi budur, hata değil.
"app/api/*.py" = ["B008"]
